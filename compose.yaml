# Sobe o sistema completo: banco, API (Spring Boot) e frontend (Nginx).
# Credenciais de e-mail são opcionais: copie .env.example para .env e preencha.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: duodev
      POSTGRES_USER: duodev
      POSTGRES_PASSWORD: duodev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duodev -d duodev"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: duodev
      DB_USERNAME: duodev
      DB_PASSWORD: duodev
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
