spring.application.name=duodev-backend
spring.profiles.active=duo-dev

# Banco de dados: configure por variáveis de ambiente (valores padrão para desenvolvimento local)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:duodev}
spring.datasource.username=${DB_USERNAME:duodev}
spring.datasource.password=${DB_PASSWORD:duodev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true

# E-mail (SMTP do Gmail com senha de app): nunca versione credenciais
duodev.mail.username=${MAIL_USERNAME:}
duodev.mail.password=${MAIL_PASSWORD:}

server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
application.url=${APPLICATION_URL:http://localhost:8080}
